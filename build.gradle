plugins {
    id 'java-library'
    id 'maven-publish'
    id 'com.gradleup.shadow' version '9.6.1'
}

// group/version are in gradle.properties (JitPack: com.github.Impopite:VyraUtils:<tag>).
// They can be overridden from CI: ./gradlew shadowJar -Pversion=1.2.3

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }

    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()

    maven {
        url = 'https://repo.papermc.io/repository/maven-public/'
    }

    maven {
        url = 'https://jitpack.io'
    }
}

dependencies {
    // Provided by the Paper server: must never be shaded.
    compileOnly 'io.papermc.paper:paper-api:1.21.8-R0.1-SNAPSHOT'
    compileOnly 'org.jetbrains:annotations:26.1.0'
    // Used by ModrinthUpdateChecker: declared explicitly instead of relying on the
    // transitive dependency of paper-api. The Paper server ships Gson at runtime
    // (it is a dependency of adventure-text-serializer-gson), so it is not shaded.
    compileOnly 'com.google.code.gson:gson:2.11.0'

    // Everything below is shaded inside VyraUtils.
    // Consumer plugins DO NOT need to declare or install these.
    // CommandAPI is part of the public API (CommandService, CommandInvocation),
    // so it is exposed to consumers using a project/composite dependency too.
    api 'dev.jorel:commandapi-paper-shade:12.1.0'
    implementation 'com.mysql:mysql-connector-j:26.10.0'
    implementation 'com.zaxxer:HikariCP:7.1.0'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

javadoc {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:all,-missing', '-quiet')
}

// The plain (unshaded) jar is not what gets published.
tasks.named('jar') {
    archiveClassifier.set('unshaded')
}

tasks.named('shadowJar') {
    archiveClassifier.set('')
    mergeServiceFiles()

    // Relocate HikariCP to avoid clashes with a copy the server may already provide.
    // CommandAPI is intentionally NOT relocated: its classes are part of the public API
    // used by CommandService/CommandInvocation.
    relocate 'com.zaxxer.hikari', 'it.impo.vyrautils.libs.hikari'

    // Relocate the whole MySQL driver, legacy com.mysql.jdbc included.
    // Without it every consumer plugin would register its own copy of the driver in the
    // global DriverManager, and the first one to answer would win.
    // Shadow also rewrites the class names written as string literals and the content of
    // META-INF/services/java.sql.Driver, so the driver keeps working relocated.
    relocate 'com.mysql', 'it.impo.vyrautils.libs.mysql'
}

publishing {
    publications {
        maven(MavenPublication) {
            // Publish the shaded jar: dependencies are already inside it,
            // so the generated POM has no transitive dependencies.
            artifact tasks.shadowJar
            artifact tasks.sourcesJar
            artifact tasks.javadocJar

            pom {
                name = 'VyraUtils'
                description = 'Shared library for Paper 1.21.8 plugins: language files, config, ' +
                    'commands, scheduling, database and update checks.'
                url = 'https://github.com/Impopite/VyraUtils'
                inceptionYear = '2026'

                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                        distribution = 'repo'
                    }
                }

                developers {
                    developer {
                        id = 'Impopite'
                        name = 'Impopite'
                        url = 'https://github.com/Impopite'
                    }
                }

                scm {
                    url = 'https://github.com/Impopite/VyraUtils'
                    connection = 'scm:git:https://github.com/Impopite/VyraUtils.git'
                    developerConnection = 'scm:git:ssh://git@github.com/Impopite/VyraUtils.git'
                }
            }
        }
    }
}

tasks.matching { it.name == 'publishMavenPublicationToMavenLocal' }.configureEach {
    dependsOn tasks.named('shadowJar')
}
